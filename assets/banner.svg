<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="800" height="200" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="160" height="40" fill="#1a1c2c"/>
  <!-- étoiles -->
  <g fill="#f4f4f4">
    <rect x="8" y="5" width="1" height="1"/><rect x="22" y="12" width="1" height="1"/>
    <rect x="47" y="4" width="1" height="1"/><rect x="63" y="10" width="1" height="1"/>
    <rect x="88" y="6" width="1" height="1"/><rect x="104" y="13" width="1" height="1"/>
    <rect x="118" y="4" width="1" height="1"/><rect x="146" y="14" width="1" height="1"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </g>
  <!-- lune -->
  <rect x="131" y="6" width="5" height="1" fill="#ffcd75"/>
  <rect x="130" y="7" width="7" height="3" fill="#ffcd75"/>
  <rect x="131" y="10" width="5" height="1" fill="#ffcd75"/>
  <!-- collines lointaines -->
  <rect x="0" y="26" width="160" height="6" fill="#333c57"/>
  <rect x="10" y="23" width="26" height="3" fill="#333c57"/>
  <rect x="16" y="21" width="14" height="2" fill="#333c57"/>
  <rect x="82" y="22" width="34" height="4" fill="#333c57"/>
  <rect x="92" y="20" width="14" height="2" fill="#333c57"/>
  <rect x="130" y="24" width="20" height="2" fill="#333c57"/>
  <!-- sol -->
  <rect x="0" y="32" width="160" height="2" fill="#38b764"/>
  <rect x="0" y="34" width="160" height="6" fill="#257179"/>
  <!-- sapins -->
  <g fill="#257179">
    <rect x="72" y="24" width="2" height="2"/><rect x="71" y="26" width="4" height="2"/>
    <rect x="70" y="28" width="6" height="2"/><rect x="69" y="30" width="8" height="2"/>
    <rect x="115" y="26" width="2" height="2"/><rect x="114" y="28" width="4" height="2"/>
    <rect x="113" y="30" width="6" height="2"/>
    <rect x="140" y="25" width="2" height="2"/><rect x="139" y="27" width="4" height="2"/>
    <rect x="138" y="29" width="6" height="3"/>
  </g>
  <!-- feu de camp -->
  <rect x="55" y="30" width="4" height="2" fill="#5d275d"/>
  <g>
    <rect x="56" y="28" width="2" height="2" fill="#ef7d57"/>
    <rect x="56" y="27" width="1" height="1" fill="#ffcd75"/>
    <animate attributeName="opacity" values="1;0.6;1;0.8;1" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <!-- personnage -->
  <g transform="translate(40 23)">
    <animateTransform attributeName="transform" type="translate" values="40 23;40 22;40 23" keyTimes="0;0.5;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
    <rect x="1" y="0" width="4" height="1" fill="#b13e53"/>
    <rect x="0" y="1" width="6" height="1" fill="#b13e53"/>
    <rect x="1" y="2" width="4" height="2" fill="#ffcd75"/>
    <rect x="2" y="2" width="1" height="1" fill="#1a1c2c"/>
    <rect x="4" y="2" width="1" height="1" fill="#1a1c2c"/>
    <rect x="1" y="4" width="4" height="3" fill="#3b5dc9"/>
    <rect x="0" y="4" width="1" height="3" fill="#3b5dc9"/>
    <rect x="5" y="4" width="1" height="3" fill="#3b5dc9"/>
    <rect x="1" y="7" width="1" height="2" fill="#333c57"/>
    <rect x="4" y="7" width="1" height="2" fill="#333c57"/>
    <rect x="6" y="3" width="1" height="4" fill="#94b0c2"/>
